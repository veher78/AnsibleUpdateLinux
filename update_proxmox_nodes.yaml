Two fixes applied — same root-cause theme as last time (a value that was supposed to be shared but wasn't):

RAM now weighted 4x over CPU (ram_weight: 4, cpu_weight: 1), in both Play 4's live migration-target selection and Play 6's rebalance scoring, so RAM dominates the decision.
The actual bug behind "even worse": Play 6's pinned_vmids was a hand-typed list of only 4 IDs (101, 103, 110, 111), while Play 4's real pinned map has 7 (also 119, 120, 126). VM 119 — pinned to PVE1-dell — wasn't in Play 6's list, so the rebalancer was free to move it around and then Play 4 would try to manage it assuming it never left. I made Play 4's map the single source of truth (YAML anchor &non_migratable_vms_map) and had Play 6 alias it and derive pinned_vmids automatically (non_migratable_vms.values() | flatten) — so a VM added to the pinned map is protected everywhere, permanently, with no second list to keep in sync.
One thing worth flagging honestly: this fixes the scheduling logic, but our score is still built from each VM's configured RAM allocation, not its live actual usage. If PVE1-dell's 93% is driven by the pinned VMs (110/111/119) genuinely using most of their allocated RAM, no amount of rebalancing the movable guests will bring that number down — those three simply can't leave that node. If after this run PVE1-dell is still pinned near that number, it's worth checking whether 110/111/119 collectively need more RAM than PVE1-dell physically has to spare, which is a capacity question, not a scheduling one.


