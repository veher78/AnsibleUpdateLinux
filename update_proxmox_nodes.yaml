---
# =============================================================================
# Proxmox Hypervisor Patching + Rolling Reboot Playbook
# =============================================================================
# Purpose  : Patch all Proxmox nodes, detect kernel upgrades, migrate VMs/CTs,
#            reboot nodes one-by-one, restore non-migratable VMs after reboot.
# Author   : Generated for Ansible Semaphore
# Requires : community.general collection, root SSH access to Proxmox nodes
#
# Non-migratable VMs (powered off before reboot, restored after):
#   VM 101 → node 192.168.1.23
#   VM 103 → node 192.168.1.22
#   VM 110 → node 192.168.1.21
#   VM 111 → node 192.168.1.21
# =============================================================================

##############################################################################
# PLAY 1 – Gather pre-patch kernel version on every Proxmox node
##############################################################################
- name: "PLAY 1 | Record current kernel on all Proxmox nodes"
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Get running kernel version
      ansible.builtin.command: uname -r
      register: kernel_before
      changed_when: false

    - name: Store kernel version as host fact
      ansible.builtin.set_fact:
        kernel_version_before: "{{ kernel_before.stdout }}"

    - name: "Show pre-patch kernel"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — kernel before patching: {{ kernel_version_before }}"


##############################################################################
# PLAY 2 – Patch every Proxmox node (apt upgrade)
##############################################################################
- name: "PLAY 2 | Apply all available updates on Proxmox nodes"
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  serial: 1          # one node at a time for patching too (safer on small clusters)

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Upgrade all packages (full-upgrade)
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true
      register: apt_upgrade_result

    - name: "Show upgrade summary"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — packages changed: {{ apt_upgrade_result.changed }}"


##############################################################################
# PLAY 3 – Detect whether a new kernel was installed
#
# Package naming on modern Proxmox VE (8.x+):
#   proxmox-kernel-<ver>-pve-signed   ← the actual bootable image (status: ii)
#   proxmox-kernel-<ver>              ← meta/helper package (also ii, ignore)
#
# uname -r returns e.g.  7.0.2-6-pve
# dpkg version field is  7.0.2-6        (no trailing -pve)
#
# Strategy:
#   1. Query only 'ii' proxmox-kernel-*-pve-signed packages
#   2. Extract the version field (e.g. 7.0.2-6)
#   3. Append -pve to match uname -r output
#   4. Sort by version, take the highest
#   5. Compare against the running kernel recorded in Play 1
##############################################################################
- name: "PLAY 3 | Detect new kernel installation"
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Find the highest installed proxmox kernel version
      ansible.builtin.shell: |
        dpkg -l 'proxmox-kernel-*-pve-signed' 2>/dev/null \
          | awk '/^ii/{print $3}' \
          | sort -V \
          | tail -1
      register: kernel_pkg_version
      changed_when: false

    # kernel_pkg_version.stdout is e.g. "7.0.2-6"
    # uname -r (kernel_version_before) is e.g. "7.0.2-6-pve"
    # Append -pve so the formats match for comparison.
    - name: Normalise installed kernel version to uname -r format
      ansible.builtin.set_fact:
        kernel_version_installed: "{{ kernel_pkg_version.stdout }}-pve"
      when: kernel_pkg_version.stdout != ''

    - name: Set new-kernel flag
      ansible.builtin.set_fact:
        new_kernel_installed: >-
          {{
            kernel_pkg_version.stdout != '' and
            kernel_version_installed != kernel_version_before
          }}

    - name: "Kernel upgrade status"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} —
          new kernel detected: {{ new_kernel_installed }}
          (running: {{ kernel_version_before }},
           latest installed: {{ kernel_version_installed | default('n/a') }})


##############################################################################
# PLAY 4 – Rolling reboot (only for nodes where a new kernel was installed)
#
# Strategy per node:
#   1. Power off non-migratable VMs pinned to this node
#   2. Migrate all migratable VMs/CTs to another online node
#   3. Reboot the node
#   4. Wait for node to come back and confirm cluster health
#   5. Restore non-migratable VMs
##############################################################################
- name: "PLAY 4 | Rolling reboot of Proxmox nodes with new kernel"
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  serial: 1          # ← critical: process nodes strictly one at a time

  vars:
    # -----------------------------------------------------------------------
    # Non-migratable VM map:  node_ip  ->  list of VMIDs to power-off/restore
    # Key = ansible_host (IP) because that is how Ansible tracks the host at
    # runtime. These are used in 4-B and 4-G tasks below.
    # -----------------------------------------------------------------------
    non_migratable_vms:
      "192.168.1.21": ["110", "111"]
      "192.168.1.22": ["103"]
      "192.168.1.23": ["101"]

    # -----------------------------------------------------------------------
    # migration_candidates: ordered list of OTHER nodes to try for migration.
    # We exclude self; the playbook logic will pick the best candidate
    # per-VM at runtime to respect HA anti-affinity rules.
    # -----------------------------------------------------------------------
    migration_candidates: >-
      {{
        groups['proxmox_nodes']
        | reject('eq', inventory_hostname)
        | list
      }}

    reboot_timeout: 600      # seconds to wait for node SSH after reboot
    cluster_settle_time: 60  # seconds to wait after node rejoins before proceeding

  tasks:
    # ------------------------------------------------------------------
    # Skip node if no new kernel was detected
    # ------------------------------------------------------------------
    - name: "Skip node if no kernel upgrade"
      ansible.builtin.meta: end_host
      when: not new_kernel_installed

    # ------------------------------------------------------------------
    # Step 4-A : Verify cluster quorum before touching this node
    # ------------------------------------------------------------------
    - name: "4-A | Check cluster quorum"
      ansible.builtin.command: pvecm status
      register: pvecm_status
      changed_when: false
      failed_when: "'Quorate' not in pvecm_status.stdout"

    - name: "4-A | Show quorum status"
      ansible.builtin.debug:
        msg: "{{ pvecm_status.stdout_lines }}"

    # ------------------------------------------------------------------
    # Step 4-B : Power off non-migratable VMs on this node
    # ------------------------------------------------------------------
    - name: "4-B | Power off non-migratable VMs"
      ansible.builtin.command: "qm shutdown {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: stop_result
      changed_when: true
      failed_when: stop_result.rc not in [0, 1]   # rc=1 = already stopped

    - name: "4-B | Wait for VMs to be fully stopped"
      ansible.builtin.command: "qm status {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: vm_status
      until: "'stopped' in vm_status.stdout"
      retries: 20
      delay: 10
      changed_when: false

    # ------------------------------------------------------------------
    # Step 4-C : Migrate all running VMs/CTs to another node,
    #            respecting HA anti-affinity rules.
    #
    # Strategy (read rules.cfg directly):
    #   Proxmox stores negative-affinity rules in /etc/pve/ha/rules.cfg.
    #   A rule block looks like:
    #
    #     affinity: my-rule-name
    #       resources vm:119,vm:120
    #       type negative
    #
    #   We parse this file with awk to build a peer map: for each vmid,
    #   which other vmids must NOT share the same node.
    #   Then for each VM to migrate, we check which candidate nodes already
    #   host a conflicting peer (via pvesh cluster/resources), and skip those.
    #   First clean candidate wins; last candidate is used as best-effort
    #   fallback with a loud WARNING if all are blocked.
    #
    #   Candidate order comes from migration_candidates (inventory order).
    #   Put pve2-dell before pve1-dell in your inventory so pve2-dell is
    #   preferred when pve3 is the node being patched.
    # ------------------------------------------------------------------
    - name: "4-C | Get list of running VMs on this node"
      ansible.builtin.shell: |
        qm list | awk 'NR>1 && $3=="running" {print $1}'
      register: running_vms
      changed_when: false

    # For each running VM, find its negative-affinity peers from rules.cfg,
    # determine which candidate nodes host those peers, and pick the first
    # conflict-free candidate, then migrate.
    - name: "4-C | Migrate running VMs (anti-affinity aware)"
      ansible.builtin.shell: |
        VMID="{{ item }}"
        CANDIDATES="{{ migration_candidates | join(' ') }}"
        RULES_CFG="/etc/pve/ha/rules.cfg"

        # --- Step 1: find peers of VMID from rules.cfg ---
        # Parse all "negative" affinity rule blocks.
        # The file lives at /etc/pve/ha/rules.cfg and looks like:
        #
        #   affinity: talos-workers
        #     resources vm:119,vm:120
        #     type negative
        #
        # python3 is always available on PVE nodes.
        PEERS=""
        if [ -f "$RULES_CFG" ]; then
          PEERS=$(python3 - "$VMID" <<'PYEOF'
        import sys, re

        target_vmid = sys.argv[1]
        target_sid  = f"vm:{target_vmid}"
        rules_cfg   = "/etc/pve/ha/rules.cfg"
        peers       = set()

        try:
            with open(rules_cfg) as f:
                content = f.read()
        except FileNotFoundError:
            sys.exit(0)

        # Split into blocks on lines that start without whitespace (stanza headers)
        blocks = re.split(r'\n(?=\S)', content.strip())
        for block in blocks:
            lines = block.strip().splitlines()
            if not lines or not lines[0].startswith("resource-affinity:"):
                continue
            resources = ""
            is_negative = False
            for line in lines[1:]:
                line = line.strip()
                if line.startswith("resources"):
                    resources = line.split(None, 1)[1] if len(line.split()) > 1 else ""
                if line.startswith("affinity") and "negative" in line:
                    is_negative = True
            if is_negative and target_sid in resources.split(","):
                for sid in resources.split(","):
                    sid = sid.strip()
                    if sid != target_sid and sid.startswith("vm:"):
                        peers.add(sid.split(":")[1])

        print(" ".join(peers))
        PYEOF
          )
        fi

        echo "VM ${VMID}: negative-affinity peers=[${PEERS}]"

        # --- Step 2: get current node of each peer ---
        # Build a snapshot of cluster VM placements once (json)
        CLUSTER_VMS=$(pvesh get /cluster/resources --type vm --output-format json 2>/dev/null || echo "[]")

        # --- Step 3: pick first candidate with no conflict ---
        chosen=""
        for node in $CANDIDATES; do
          conflict=0
          for peer in $PEERS; do
            peer_node=$(echo "$CLUSTER_VMS" | python3 -c "
        import sys,json
        data=json.load(sys.stdin)
        peer=sys.argv[1]
        for v in data:
            if str(v.get('vmid',''))==peer:
                print(v.get('node',''))
                break
        " "$peer" 2>/dev/null || true)
            if [ "$peer_node" = "$node" ]; then
              echo "  Conflict: peer vm:${peer} is on ${node}, skipping"
              conflict=1
              break
            fi
          done
          if [ "$conflict" -eq 0 ]; then
            chosen="$node"
            echo "  Selected: ${node} (no conflicts)"
            break
          fi
        done

        # --- Step 4: fallback if all candidates blocked ---
        if [ -z "$chosen" ]; then
          chosen=$(echo "$CANDIDATES" | awk '{print $NF}')
          echo "WARNING: all candidates blocked for VM ${VMID}, forcing to ${chosen}" >&2
        fi

        echo "Migrating VM ${VMID} -> ${chosen}"
        qm migrate "$VMID" "$chosen" --online
      loop: "{{ running_vms.stdout_lines }}"
      when: running_vms.stdout_lines | length > 0
      register: migrate_vm_result

    - name: "4-C | Show VM migration results"
      ansible.builtin.debug:
        msg: "{{ item.stdout_lines | default([]) + item.stderr_lines | default([]) }}"
      loop: "{{ migrate_vm_result.results | default([]) }}"
      loop_control:
        label: "VM {{ item.item }}"
      when: migrate_vm_result.results is defined

    - name: "4-C | Get list of running LXC containers on this node"
      ansible.builtin.shell: |
        pct list | awk 'NR>1 && $2=="running" {print $1}'
      register: running_cts
      changed_when: false

    # LXC containers: use first available candidate (CTs rarely have anti-affinity)
    - name: "4-C | Migrate running CTs to {{ migration_candidates | first }}"
      ansible.builtin.command: >
        pct migrate {{ item }} {{ migration_candidates | first }} --restart
      loop: "{{ running_cts.stdout_lines }}"
      when: running_cts.stdout_lines | length > 0
      register: migrate_ct_result

    - name: "4-C | Pause to let migrations settle"
      ansible.builtin.pause:
        seconds: 30

    # ------------------------------------------------------------------
    # Step 4-D : Confirm node is now empty (no running guests)
    #
    # Both checks use a retry loop instead of a one-shot fail, because:
    #   - pct migrate --restart stops the CT on the source, starts it on the
    #     target — the source-side stop can lag behind the migrate command
    #     returning, especially for CTs with heavy memory or slow disks.
    #   - qm migrate --online for VMs can similarly take a moment to fully
    #     vacate the source node after the command exits.
    #
    # 15 retries x 20s = up to 5 minutes of patience per check.
    # If a guest is still present after that, we fail loudly with its ID
    # so you know exactly which guest blocked the reboot.
    # ------------------------------------------------------------------
    - name: "4-D | Wait until no VMs remain running on this node"
      ansible.builtin.shell: |
        qm list | awk 'NR>1 && $3=="running" {print $1}'
      register: remaining_vms
      changed_when: false
      failed_when: false
      retries: 15
      delay: 20
      until: remaining_vms.stdout_lines | length == 0

    - name: "4-D | Fail if VMs are still running after timeout"
      ansible.builtin.fail:
        msg: >-
          The following VMs are still running on {{ inventory_hostname }}
          after waiting for migration to complete: {{ remaining_vms.stdout_lines | join(', ') }}.
          Check migration status manually with: qm list
      when: remaining_vms.stdout_lines | length > 0

    - name: "4-D | Wait until no CTs remain running on this node"
      ansible.builtin.shell: |
        pct list | awk 'NR>1 && $2=="running" {print $1}'
      register: remaining_cts
      changed_when: false
      failed_when: false
      retries: 15
      delay: 20
      until: remaining_cts.stdout_lines | length == 0

    - name: "4-D | Fail if CTs are still running after timeout"
      ansible.builtin.fail:
        msg: >-
          The following CTs are still running on {{ inventory_hostname }}
          after waiting for migration to complete: {{ remaining_cts.stdout_lines | join(', ') }}.
          Check migration status manually with: pct list
      when: remaining_cts.stdout_lines | length > 0

    # ------------------------------------------------------------------
    # Step 4-E : Reboot the node
    # ------------------------------------------------------------------
    - name: "4-E | Reboot Proxmox node {{ inventory_hostname }}"
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 10
        post_reboot_delay: 30
        connect_timeout: 15
        msg: "Ansible rolling reboot — new PVE kernel detected"

    # ------------------------------------------------------------------
    # Step 4-F : Verify node rejoined the cluster and kernel updated
    # ------------------------------------------------------------------
    - name: "4-F | Get kernel version after reboot"
      ansible.builtin.command: uname -r
      register: kernel_after
      changed_when: false

    - name: "4-F | Confirm new kernel is running"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} rebooted successfully.
          Old kernel: {{ kernel_version_before }}
          New kernel:  {{ kernel_after.stdout }}

    - name: "4-F | Check cluster quorum after reboot"
      ansible.builtin.command: pvecm status
      register: pvecm_post
      changed_when: false
      # failed_when: false is critical — pvecm status returns rc=2 when the node
      # has not yet rejoined quorum. Without this, rc=2 causes a hard failure on
      # attempt 1, bypassing the retry loop entirely.
      failed_when: false
      # 20 retries x 20s = up to 400s (~6.5 min) for corosync to reform quorum.
      retries: 20
      delay: 20
      # pvecm outputs "Quorate:          Yes" with variable whitespace.
      # Use a regex search instead of a literal string match to be whitespace-safe.
      until: >-
        pvecm_post.rc == 0 and
        (pvecm_post.stdout | regex_search('Quorate:\s+Yes')) is not none

    - name: "4-F | Fail explicitly if quorum was never restored"
      ansible.builtin.fail:
        msg: >-
          Cluster quorum was NOT restored after {{ 20 * 20 }}s.
          Last pvecm output: {{ pvecm_post.stdout }}
          Manual intervention required before proceeding to the next node.
      when: >-
        pvecm_post.rc != 0 or
        (pvecm_post.stdout | regex_search('Quorate:\s+Yes')) is none

    - name: "4-F | Show quorum restored"
      ansible.builtin.debug:
        msg: "Quorum restored on {{ inventory_hostname }} — proceeding to settle wait."

    - name: "4-F | Wait {{ cluster_settle_time }}s for cluster to fully stabilise"
      ansible.builtin.pause:
        seconds: "{{ cluster_settle_time }}"

    # ------------------------------------------------------------------
    # Step 4-G : Restore non-migratable VMs
    # ------------------------------------------------------------------
    - name: "4-G | Start non-migratable VMs"
      ansible.builtin.command: "qm start {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: start_result
      changed_when: true

    - name: "4-G | Wait for VMs to reach running state"
      ansible.builtin.command: "qm status {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: vm_start_status
      until: "'running' in vm_start_status.stdout"
      retries: 20
      delay: 10
      changed_when: false

    - name: "4-G | Confirm all non-migratable VMs are back online"
      ansible.builtin.debug:
        msg: >-
          Node {{ inventory_hostname }} — restored VMs:
          {{ non_migratable_vms[ansible_host] | default([]) | join(', ') }}


##############################################################################
# PLAY 5 – Final cluster health report
##############################################################################
- name: "PLAY 5 | Final cluster health check"
  hosts: proxmox_nodes[0]   # run once from the first node
  gather_facts: false
  become: true

  tasks:
    - name: "5 | Cluster node list"
      ansible.builtin.command: pvecm nodes
      register: pvecm_nodes
      changed_when: false

    - name: "5 | Cluster status"
      ansible.builtin.command: pvecm status
      register: pvecm_final
      changed_when: false

    - name: "5 | Display final cluster report"
      ansible.builtin.debug:
        msg:
          - "===== FINAL CLUSTER HEALTH ====="
          - "{{ pvecm_nodes.stdout_lines }}"
          - "================================"
          - "{{ pvecm_final.stdout_lines }}"

    - name: "5 | List all running guests across the cluster"
      ansible.builtin.shell: |
        pvesh get /cluster/resources --type vm 2>/dev/null \
          | grep '"status":"running"' | grep -oP '"name":"\K[^"]+' || true
      register: running_guests
      changed_when: false

    - name: "5 | Running guests report"
      ansible.builtin.debug:
        msg: "Running guests: {{ running_guests.stdout_lines }}"


##############################################################################
# PLAY 6 – Cluster load rebalancing (CPU + RAM weighted)
#
# Runs automatically after patching to spread VMs evenly across all 3 nodes.
#
# Scope:
#   - Only considers RUNNING VMs
#   - Excludes VMs pinned by node-affinity strict rules (rules.cfg)
#   - Excludes VMs in the non_migratable_vms map
#   - Respects resource-affinity negative rules when choosing destination
#
# Load metric: weighted score = (vCPUs * cpu_weight) + (RAM_GB * ram_weight)
# Balance threshold: stops when max_node_score - min_node_score < 20% of total
#
# All logic runs as a single Python3 script on the first cluster node,
# emitting an ordered list of (vmid, source_node, dest_node) moves.
# Ansible then executes the moves sequentially with a settle pause.
##############################################################################
- name: "PLAY 6 | Rebalance VM load across cluster nodes"
  hosts: proxmox_nodes[0]
  gather_facts: false
  become: true

  vars:
    # Weights for the load score — adjust to taste
    cpu_weight: 1
    ram_weight: 1   # per GB

    # Max spread tolerated before we stop rebalancing:
    # if (max_score - min_score) / total_score < this, cluster is balanced
    balance_threshold: 0.20

    # Seconds to wait between individual VM migrations
    migrate_settle_seconds: 20

    # Flat list of all pinned VMIDs (from the non_migratable_vms map in Play 4)
    pinned_vmids:
      - "101"
      - "103"
      - "110"
      - "111"

  tasks:
    - name: "6 | Write rebalance script to disk"
      ansible.builtin.copy:
        dest: /tmp/pve_rebalance.py
        mode: "0700"
        content: |
          import subprocess, json, re, sys

          CPU_W     = float(sys.argv[1])
          RAM_W     = float(sys.argv[2])
          THRESHOLD = float(sys.argv[3])
          PINNED    = set(sys.argv[4].split(",")) if sys.argv[4] else set()
          RULES_CFG = "/etc/pve/ha/rules.cfg"

          def pvesh(path):
              raw = subprocess.check_output(
                  ["pvesh", "get", path, "--type", "vm", "--output-format", "json"],
                  stderr=subprocess.DEVNULL, text=True)
              return json.loads(raw)

          try:
              rules_text = open(RULES_CFG).read()
          except FileNotFoundError:
              rules_text = ""

          blocks = re.split(r'\n(?=\S)', rules_text.strip())
          node_pinned = {}
          neg_peers   = {}

          for block in blocks:
              lines = [l.strip() for l in block.strip().splitlines()]
              if not lines:
                  continue
              header = lines[0]
              props = {}
              for l in lines[1:]:
                  parts = l.split(None, 1)
                  if len(parts) == 2:
                      props[parts[0]] = parts[1]

              if header.startswith("node-affinity:") and props.get("strict", "0") == "1":
                  for sid in props.get("resources", "").split(","):
                      sid = sid.strip()
                      if sid.startswith("vm:"):
                          vmid = sid.split(":")[1]
                          allowed = set(n.strip() for n in props.get("nodes", "").split(","))
                          node_pinned[vmid] = allowed

              if header.startswith("resource-affinity:") and props.get("affinity") == "negative":
                  members    = [s.strip() for s in props.get("resources", "").split(",")]
                  member_ids = [s.split(":")[1] for s in members if s.startswith("vm:")]
                  for vmid in member_ids:
                      if vmid not in neg_peers:
                          neg_peers[vmid] = set()
                      neg_peers[vmid].update(p for p in member_ids if p != vmid)

          cluster_vms = pvesh("/cluster/resources")
          nodes = sorted(set(v["node"] for v in cluster_vms if "node" in v))

          vm_info = {}
          for v in cluster_vms:
              if v.get("type") != "qemu" or v.get("status") != "running":
                  continue
              vmid = str(v["vmid"])
              if vmid in PINNED or vmid in node_pinned:
                  continue
              vm_info[vmid] = {
                  "node":   v["node"],
                  "cpus":   v.get("maxcpu", 1),
                  "ram_gb": v.get("maxmem", 1073741824) / 1073741824,
              }

          def score(vm):
              return vm["cpus"] * CPU_W + vm["ram_gb"] * RAM_W

          moves    = []
          MAX_MOVES = 20

          for _ in range(MAX_MOVES):
              node_score = {n: 0.0 for n in nodes}
              node_vms   = {n: [] for n in nodes}
              for vmid, info in vm_info.items():
                  s = score(info)
                  node_score[info["node"]] += s
                  node_vms[info["node"]].append((vmid, s))

              total = sum(node_score.values())
              if total == 0:
                  break

              max_node = max(node_score, key=node_score.get)
              min_node = min(node_score, key=node_score.get)
              spread   = (node_score[max_node] - node_score[min_node]) / total

              if spread < THRESHOLD:
                  break

              candidates = sorted(node_vms[max_node], key=lambda x: x[1], reverse=True)
              moved = False
              for vmid, _ in candidates:
                  peers        = neg_peers.get(vmid, set())
                  peers_on_min = [p for p in peers if vm_info.get(p, {}).get("node") == min_node]
                  if peers_on_min:
                      continue
                  moves.append({"vmid": vmid, "from": max_node, "to": min_node})
                  vm_info[vmid]["node"] = min_node
                  moved = True
                  break

              if not moved:
                  break

          print(json.dumps(moves))

    - name: "6 | Compute rebalance move plan"
      ansible.builtin.command: >
        python3 /tmp/pve_rebalance.py
        {{ cpu_weight }}
        {{ ram_weight }}
        {{ balance_threshold }}
        {{ pinned_vmids | join(',') }}
      register: rebalance_plan_raw
      changed_when: false

    - name: "6 | Parse move plan"
      ansible.builtin.set_fact:
        rebalance_moves: "{{ rebalance_plan_raw.stdout | from_json }}"

    - name: "6 | Show rebalance plan"
      ansible.builtin.debug:
        msg: >-
          {% if rebalance_moves | length == 0 %}
          Cluster is already balanced — no moves needed.
          {% else %}
          Planned {{ rebalance_moves | length }} move(s):
          {% for m in rebalance_moves %}
            VM {{ m.vmid }}: {{ m.from }} → {{ m.to }}
          {% endfor %}
          {% endif %}

    - name: "6 | Execute VM migrations"
      ansible.builtin.command: >
        qm migrate {{ item.vmid }} {{ item.to }} --online
      loop: "{{ rebalance_moves }}"
      loop_control:
        label: "VM {{ item.vmid }}: {{ item.from }} → {{ item.to }}"
      when: rebalance_moves | length > 0
      register: rebalance_migrate_result

    - name: "6 | Pause between migrations to let cluster settle"
      ansible.builtin.pause:
        seconds: "{{ migrate_settle_seconds }}"
      loop: "{{ rebalance_moves }}"
      loop_control:
        label: "Settling after VM {{ item.vmid }}"
      when: rebalance_moves | length > 0

    - name: "6 | Rebalance complete — final node load summary"
      ansible.builtin.shell: |
        python3 - <<'PYEOF'
        import subprocess, json
        cluster_vms = json.loads(subprocess.check_output(
            ["pvesh", "get", "/cluster/resources", "--output-format", "json"],
            stderr=subprocess.DEVNULL, text=True))
        node_score = {}
        node_count = {}
        for v in cluster_vms:
            if v.get("type") != "qemu" or v.get("status") != "running":
                continue
            n = v["node"]
            node_score[n] = node_score.get(n, 0) + v.get("maxcpu", 1) + v.get("maxmem", 1073741824) / 1073741824
            node_count[n] = node_count.get(n, 0) + 1
        for n in sorted(node_score):
            print(f"  {n}: {node_count[n]} VMs, weighted score={node_score[n]:.1f}")
        PYEOF
      register: final_summary
      changed_when: false

    - name: "6 | Show final load summary"
      ansible.builtin.debug:
        msg: "{{ final_summary.stdout_lines }}"
        
    - name: Re-apply PVE sensors mod (uninstall then reinstall)
      shell: |
        bash /root/pve-mod-gui-sensors.sh uninstall --unattended || true
        printf 'c\ny\ny\nn\nc\nn\n' | bash /root/pve-mod-gui-sensors.sh install
      ignore_errors: false

