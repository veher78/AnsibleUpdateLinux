Two separate bugs, and the second one is the nastier one:

Bug 1 — qm migrate runs from the wrong node. Play 6 only runs on proxmox_nodes[0] (PVE1-dell), but qm migrate is a local command — it must be issued from the node that currently owns the VM, not from an arbitrary cluster member. That's exactly what both errors say: "target is local node" when the plan tried to migrate VM 124 to PVE1-dell while running from PVE1-dell, and "Configuration file ... does not exist" when it tried to migrate FROM PVE1-dell a VM that actually lives on pve2-dell. This was a latent bug in the original playbook too — it just never got exercised because Play 6 rarely produced real moves before we tightened the threshold.

Bug 2 — the oscillation itself. With balance_threshold: 0.05 and only a couple of movable VMs (124 being the big one), the greedy algorithm can't get the two nodes within 5% of each other no matter what it does — so it keeps "fixing" the imbalance by flipping VM 124 back and forth, burning all the way up to MAX_MOVES: 50. The old 0.20 threshold masked this because it usually gave up before oscillating.

Fixing both:


