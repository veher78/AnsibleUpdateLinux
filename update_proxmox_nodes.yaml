Fixed both:

delegate_to: "{{ item.from }}" on the migration task, so qm migrate actually runs from the node that owns the VM instead of always from PVE1-dell. This alone would have fixed the crash you saw.
Each VM can now only move once per rebalance run (moved_vmids set) — if the cluster can't get under the 5% threshold with the remaining un-moved guests, the script stops instead of flip-flopping the same VM until it hits the 50-move cap.
With only a couple of running VMs and this much RAM/CPU granularity, you may still land a bit above 5% after one run — that's expected and fine; better than churning VM 124 fifty times. If you want, next run's threshold miss will just show up as "no moves made" in the debug output rather than an error.


