---
# =============================================================================
# Proxmox Hypervisor Patching + Rolling Reboot Playbook
# =============================================================================
# Purpose  : Patch all Proxmox nodes, detect kernel upgrades, migrate VMs/CTs,
#            reboot nodes one-by-one, restore non-migratable VMs after reboot.
# Author   : Generated for Ansible Semaphore
# Requires : community.general collection, root SSH access to Proxmox nodes
#
# Non-migratable VMs (powered off before reboot, restored after):
#   VM 101 → node 192.168.1.23
#   VM 103 → node 192.168.1.22
#   VM 110 → node 192.168.1.21
#   VM 111 → node 192.168.1.21
# =============================================================================

##############################################################################
# PLAY 1 – Gather pre-patch kernel version on every Proxmox node
##############################################################################
- name: "PLAY 1 | Record current kernel on all Proxmox nodes"
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Get running kernel version
      ansible.builtin.command: uname -r
      register: kernel_before
      changed_when: false

    - name: Store kernel version as host fact
      ansible.builtin.set_fact:
        kernel_version_before: "{{ kernel_before.stdout }}"

    - name: "Show pre-patch kernel"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — kernel before patching: {{ kernel_version_before }}"


##############################################################################
# PLAY 2 – Patch every Proxmox node (apt upgrade)
##############################################################################
- name: "PLAY 2 | Apply all available updates on Proxmox nodes"
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  serial: 1          # one node at a time for patching too (safer on small clusters)

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Upgrade all packages (full-upgrade)
      ansible.builtin.apt:
        upgrade: full
        autoremove: true
        autoclean: true
      register: apt_upgrade_result

    - name: "Show upgrade summary"
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — packages changed: {{ apt_upgrade_result.changed }}"


##############################################################################
# PLAY 3 – Detect whether a new kernel was installed
#
# Package naming on modern Proxmox VE (8.x+):
#   proxmox-kernel-<ver>-pve-signed   ← the actual bootable image (status: ii)
#   proxmox-kernel-<ver>              ← meta/helper package (also ii, ignore)
#
# uname -r returns e.g.  7.0.2-6-pve
# dpkg version field is  7.0.2-6        (no trailing -pve)
#
# Strategy:
#   1. Query only 'ii' proxmox-kernel-*-pve-signed packages
#   2. Extract the version field (e.g. 7.0.2-6)
#   3. Append -pve to match uname -r output
#   4. Sort by version, take the highest
#   5. Compare against the running kernel recorded in Play 1
##############################################################################
- name: "PLAY 3 | Detect new kernel installation"
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Find the highest installed proxmox kernel version
      ansible.builtin.shell: |
        dpkg -l 'proxmox-kernel-*-pve-signed' 2>/dev/null \
          | awk '/^ii/{print $3}' \
          | sort -V \
          | tail -1
      register: kernel_pkg_version
      changed_when: false

    # kernel_pkg_version.stdout is e.g. "7.0.2-6"
    # uname -r (kernel_version_before) is e.g. "7.0.2-6-pve"
    # Append -pve so the formats match for comparison.
    - name: Normalise installed kernel version to uname -r format
      ansible.builtin.set_fact:
        kernel_version_installed: "{{ kernel_pkg_version.stdout }}-pve"
      when: kernel_pkg_version.stdout != ''

    - name: Set new-kernel flag
      ansible.builtin.set_fact:
        new_kernel_installed: >-
          {{
            kernel_pkg_version.stdout != '' and
            kernel_version_installed != kernel_version_before
          }}

    - name: "Kernel upgrade status"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} —
          new kernel detected: {{ new_kernel_installed }}
          (running: {{ kernel_version_before }},
           latest installed: {{ kernel_version_installed | default('n/a') }})


##############################################################################
# PLAY 4 – Rolling reboot (only for nodes where a new kernel was installed)
#
# Strategy per node:
#   1. Power off non-migratable VMs pinned to this node
#   2. Migrate all migratable VMs/CTs to another online node
#   3. Reboot the node
#   4. Wait for node to come back and confirm cluster health
#   5. Restore non-migratable VMs
##############################################################################
- name: "PLAY 4 | Rolling reboot of Proxmox nodes with new kernel"
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  serial: 1          # ← critical: process nodes strictly one at a time

  vars:
    # -----------------------------------------------------------------------
    # Non-migratable VM map:  node_ip  ->  list of VMIDs to power-off/restore
    # Key = ansible_host (IP) because that is how Ansible tracks the host at
    # runtime. These are used in 4-B and 4-G tasks below.
    # -----------------------------------------------------------------------
    non_migratable_vms:
      "192.168.1.21": ["110", "111"]
      "192.168.1.22": ["103"]
      "192.168.1.23": ["101"]

    # -----------------------------------------------------------------------
    # migration_target MUST be the Proxmox cluster node NAME, not an IP.
    # pct migrate / qm migrate validate against `pvecm nodes` output.
    # inventory_hostname in this playbook IS the node name (pve-node1 etc.),
    # so we simply reject self from the group and take the first remaining.
    # -----------------------------------------------------------------------
    migration_target: >-
      {{
        groups['proxmox_nodes']
        | reject('eq', inventory_hostname)
        | list | first
      }}

    reboot_timeout: 600      # seconds to wait for node SSH after reboot
    cluster_settle_time: 60  # seconds to wait after node rejoins before proceeding

  tasks:
    # ------------------------------------------------------------------
    # Skip node if no new kernel was detected
    # ------------------------------------------------------------------
    - name: "Skip node if no kernel upgrade"
      ansible.builtin.meta: end_host
      when: not new_kernel_installed

    # ------------------------------------------------------------------
    # Step 4-A : Verify cluster quorum before touching this node
    # ------------------------------------------------------------------
    - name: "4-A | Check cluster quorum"
      ansible.builtin.command: pvecm status
      register: pvecm_status
      changed_when: false
      failed_when: "'Quorate' not in pvecm_status.stdout"

    - name: "4-A | Show quorum status"
      ansible.builtin.debug:
        msg: "{{ pvecm_status.stdout_lines }}"

    # ------------------------------------------------------------------
    # Step 4-B : Power off non-migratable VMs on this node
    # ------------------------------------------------------------------
    - name: "4-B | Power off non-migratable VMs"
      ansible.builtin.command: "qm shutdown {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: stop_result
      changed_when: true
      failed_when: stop_result.rc not in [0, 1]   # rc=1 = already stopped

    - name: "4-B | Wait for VMs to be fully stopped"
      ansible.builtin.command: "qm status {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: vm_status
      until: "'stopped' in vm_status.stdout"
      retries: 20
      delay: 10
      changed_when: false

    # ------------------------------------------------------------------
    # Step 4-C : Migrate all running VMs to another node
    # ------------------------------------------------------------------
    - name: "4-C | Get list of running VMs on this node"
      ansible.builtin.shell: |
        qm list | awk 'NR>1 && $3=="running" {print $1}'
      register: running_vms
      changed_when: false

    - name: "4-C | Migrate running VMs to {{ migration_target }}"
      ansible.builtin.command: >
        qm migrate {{ item }} {{ migration_target }} --online
      loop: "{{ running_vms.stdout_lines }}"
      when: running_vms.stdout_lines | length > 0
      register: migrate_vm_result

    - name: "4-C | Get list of running LXC containers on this node"
      ansible.builtin.shell: |
        pct list | awk 'NR>1 && $2=="running" {print $1}'
      register: running_cts
      changed_when: false

    - name: "4-C | Migrate running CTs to {{ migration_target }}"
      ansible.builtin.command: >
        pct migrate {{ item }} {{ migration_target }} --restart
      loop: "{{ running_cts.stdout_lines }}"
      when: running_cts.stdout_lines | length > 0
      register: migrate_ct_result

    - name: "4-C | Pause to let migrations settle"
      ansible.builtin.pause:
        seconds: 30

    # ------------------------------------------------------------------
    # Step 4-D : Confirm node is now empty (no running guests)
    #
    # Both checks use a retry loop instead of a one-shot fail, because:
    #   - pct migrate --restart stops the CT on the source, starts it on the
    #     target — the source-side stop can lag behind the migrate command
    #     returning, especially for CTs with heavy memory or slow disks.
    #   - qm migrate --online for VMs can similarly take a moment to fully
    #     vacate the source node after the command exits.
    #
    # 15 retries x 20s = up to 5 minutes of patience per check.
    # If a guest is still present after that, we fail loudly with its ID
    # so you know exactly which guest blocked the reboot.
    # ------------------------------------------------------------------
    - name: "4-D | Wait until no VMs remain running on this node"
      ansible.builtin.shell: |
        qm list | awk 'NR>1 && $3=="running" {print $1}'
      register: remaining_vms
      changed_when: false
      failed_when: false
      retries: 15
      delay: 20
      until: remaining_vms.stdout_lines | length == 0

    - name: "4-D | Fail if VMs are still running after timeout"
      ansible.builtin.fail:
        msg: >-
          The following VMs are still running on {{ inventory_hostname }}
          after waiting for migration to complete: {{ remaining_vms.stdout_lines | join(', ') }}.
          Check migration status manually with: qm list
      when: remaining_vms.stdout_lines | length > 0

    - name: "4-D | Wait until no CTs remain running on this node"
      ansible.builtin.shell: |
        pct list | awk 'NR>1 && $2=="running" {print $1}'
      register: remaining_cts
      changed_when: false
      failed_when: false
      retries: 15
      delay: 20
      until: remaining_cts.stdout_lines | length == 0

    - name: "4-D | Fail if CTs are still running after timeout"
      ansible.builtin.fail:
        msg: >-
          The following CTs are still running on {{ inventory_hostname }}
          after waiting for migration to complete: {{ remaining_cts.stdout_lines | join(', ') }}.
          Check migration status manually with: pct list
      when: remaining_cts.stdout_lines | length > 0

    # ------------------------------------------------------------------
    # Step 4-E : Reboot the node
    # ------------------------------------------------------------------
    - name: "4-E | Reboot Proxmox node {{ inventory_hostname }}"
      ansible.builtin.reboot:
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 10
        post_reboot_delay: 30
        connect_timeout: 15
        msg: "Ansible rolling reboot — new PVE kernel detected"

    # ------------------------------------------------------------------
    # Step 4-F : Verify node rejoined the cluster and kernel updated
    # ------------------------------------------------------------------
    - name: "4-F | Get kernel version after reboot"
      ansible.builtin.command: uname -r
      register: kernel_after
      changed_when: false

    - name: "4-F | Confirm new kernel is running"
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} rebooted successfully.
          Old kernel: {{ kernel_version_before }}
          New kernel:  {{ kernel_after.stdout }}

    - name: "4-F | Check cluster quorum after reboot"
      ansible.builtin.command: pvecm status
      register: pvecm_post
      changed_when: false
      # failed_when: false is critical — pvecm status returns rc=2 when the node
      # has not yet rejoined quorum. Without this, rc=2 causes a hard failure on
      # attempt 1, bypassing the retry loop entirely.
      failed_when: false
      # 20 retries x 20s = up to 400s (~6.5 min) for corosync to reform quorum.
      retries: 20
      delay: 20
      # pvecm outputs "Quorate:          Yes" with variable whitespace.
      # Use a regex search instead of a literal string match to be whitespace-safe.
      until: >-
        pvecm_post.rc == 0 and
        (pvecm_post.stdout | regex_search('Quorate:\s+Yes')) is not none

    - name: "4-F | Fail explicitly if quorum was never restored"
      ansible.builtin.fail:
        msg: >-
          Cluster quorum was NOT restored after {{ 20 * 20 }}s.
          Last pvecm output: {{ pvecm_post.stdout }}
          Manual intervention required before proceeding to the next node.
      when: >-
        pvecm_post.rc != 0 or
        (pvecm_post.stdout | regex_search('Quorate:\s+Yes')) is none

    - name: "4-F | Show quorum restored"
      ansible.builtin.debug:
        msg: "Quorum restored on {{ inventory_hostname }} — proceeding to settle wait."

    - name: "4-F | Wait {{ cluster_settle_time }}s for cluster to fully stabilise"
      ansible.builtin.pause:
        seconds: "{{ cluster_settle_time }}"

    # ------------------------------------------------------------------
    # Step 4-G : Restore non-migratable VMs
    # ------------------------------------------------------------------
    - name: "4-G | Start non-migratable VMs"
      ansible.builtin.command: "qm start {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: start_result
      changed_when: true

    - name: "4-G | Wait for VMs to reach running state"
      ansible.builtin.command: "qm status {{ item }}"
      loop: "{{ non_migratable_vms[ansible_host] | default([]) }}"
      register: vm_start_status
      until: "'running' in vm_start_status.stdout"
      retries: 20
      delay: 10
      changed_when: false

    - name: "4-G | Confirm all non-migratable VMs are back online"
      ansible.builtin.debug:
        msg: >-
          Node {{ inventory_hostname }} — restored VMs:
          {{ non_migratable_vms[ansible_host] | default([]) | join(', ') }}


##############################################################################
# PLAY 5 – Final cluster health report
##############################################################################
- name: "PLAY 5 | Final cluster health check"
  hosts: proxmox_nodes[0]   # run once from the first node
  gather_facts: false
  become: true

  tasks:
    - name: "5 | Cluster node list"
      ansible.builtin.command: pvecm nodes
      register: pvecm_nodes
      changed_when: false

    - name: "5 | Cluster status"
      ansible.builtin.command: pvecm status
      register: pvecm_final
      changed_when: false

    - name: "5 | Display final cluster report"
      ansible.builtin.debug:
        msg:
          - "===== FINAL CLUSTER HEALTH ====="
          - "{{ pvecm_nodes.stdout_lines }}"
          - "================================"
          - "{{ pvecm_final.stdout_lines }}"

    - name: "5 | List all running guests across the cluster"
      ansible.builtin.shell: |
        pvesh get /cluster/resources --type vm 2>/dev/null \
          | grep '"status":"running"' | grep -oP '"name":"\K[^"]+' || true
      register: running_guests
      changed_when: false

    - name: "5 | Running guests report"
      ansible.builtin.debug:
        msg: "Running guests: {{ running_guests.stdout_lines }}"
